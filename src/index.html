<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 3rem 1rem;
        }

        #app {
            width: 100%;
            max-width: 480px;
        }

        form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: #555; }

        button {
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button:hover { background: #f0f0f0; }

        nav {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 0.75rem;
        }

        nav button {
            font-size: 0.8rem;
            padding: 0.3rem 0.75rem;
            color: #555;
        }

        nav button.active {
            background: #222;
            color: #fff;
            border-color: #222;
        }

        ul {
            list-style: none;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.875rem;
            border-bottom: 1px solid #f0f0f0;
        }

        li:last-child { border-bottom: none; }

        li span { flex: 1; }

        li[data-empty] { color: #aaa; font-style: italic; justify-content: center; }

        li button {
            font-size: 0.75rem;
            color: #999;
            border-color: transparent;
            background: none;
            padding: 0.2rem 0.5rem;
        }

        li button:hover { color: #c00; background: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
